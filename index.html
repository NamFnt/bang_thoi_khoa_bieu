<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng thời khóa biểu</title>
    <style>
        table
        {
            border: 1px soil black;
            border-spacing: 2px;
        }
        thead
        {
            background-color: rgb(211, 211, 211);
        }
        tfoot
        {
            background-color: rgb(230, 230, 230);
            text-align: center;
        }
        th
        {
            width: 150px;
            height: 20px;
        }
        td
        {
            width: 150px;
            height: 20px;
            text-indent: 6px;
        }
    </style>
</head>
<body>
    <h1>Example: Student Timetable</h1>
    <table border="1px soil black;">
        <caption>Student Timetable - Semester 1</caption>
        <thead>
        <tr>
            <th>Tiết</th>
            <th>Thứ 2</th>
            <th>Thứ 3</th>
            <th>Thứ 4</th>
            <th>Thứ 5</th>
            <th>Thứ 6</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <th>Tiết 1</th>
            <td rowspan="2">Trống</td>
            <td rowspan="2">Trống</td>
            <td>Nhập Môn Lập Trình</td>
            <td rowspan="2">Toán Cao Cấp 1</td>
            <td rowspan="2">Trống</td>
        
        </tr>
        <tr>
            <th>Tiết 2</th>
            <td>Triết Học</td>
        </tr>
        <tr>
            <th colspan="6">Ăn Trưa</th>
        </tr>
        <tr>
            <th>Tiết 3</th>
            <td rowspan="3">Trống</td>
            <td rowspan="3">Trống</td>
            <td rowspan="3">Trống</td>
            <td rowspan="3">Trống</td>
            <td rowspan="3">Trống</td>
        </tr>
        <tr>
            <th>Tiết 4</th>
        </tr>
        <tr>
            <th>Tiết 5</th>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <td style="background-color: rgb(240, 240, 240)"  colspan="6">Note: This timetable is subject to change.</td>
        </tr>
        </tfoot>
    </table>
</body>
</html>
